<div class="assistant-widget" ng-controller="AssistantController">
  <button class="assistant-fab" ng-click="toggle()" aria-label="Open HMS assistant">
    <i class="fa-solid" ng-class="open ? 'fa-xmark' : 'fa-robot'"></i>
  </button>

  <section class="assistant-panel" ng-show="open" role="dialog" aria-label="HMS assistant">
    <header class="assistant-header">
      <strong><i class="fa-solid fa-robot me-2"></i>HMS Assistant</strong>
      <button type="button" class="btn-close btn-close-white" ng-click="toggle()" aria-label="Close"></button>
    </header>

    <div class="assistant-modes">
      <button type="button" ng-class="{active: mode === 'quick'}" ng-click="setMode('quick')">
        <i class="fa-solid fa-bolt"></i> Quick Desk
      </button>
      <button type="button" ng-class="{active: mode === 'ai'}" ng-click="setMode('ai')">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI Assistant
      </button>
    </div>

    <div class="assistant-body" id="assistantBody">
      <div class="assistant-msg" ng-repeat="m in messages" ng-class="m.role">
        <div class="bubble" ng-class="{error: m.error}" ng-bind-html="m.html"></div>
      </div>
      <div class="assistant-msg assistant" ng-if="sending">
        <div class="bubble typing"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="assistant-chips" ng-if="mode === 'quick' && suggestions.length">
      <button type="button" class="assistant-chip" ng-repeat="s in suggestions"
              ng-click="pick(s)" ng-disabled="sending">{{s.label}}</button>
    </div>

    <form class="assistant-input" ng-submit="send()">
      <input type="text" ng-model="input" maxlength="300" autocomplete="off"
             placeholder="{{ mode === 'quick' ? 'Ask Quick Desk...' : 'Ask the AI assistant...' }}"
             ng-disabled="sending">
      <button type="submit" class="btn btn-primary" ng-disabled="sending || !input" aria-label="Send">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </section>
</div>
