<div class="animate-fade-in pb-5">
  <div class="d-flex align-items-center mb-4">
    <button class="btn btn-light rounded-circle shadow-sm me-3" ng-click="goBack()" style="width: 40px; height: 40px;">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="d-flex flex-column">
      <h2 class="fw-bold mb-0" style="font-size: 1.75rem;">Change Password</h2>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
        <form name="passwordForm" ng-submit="updatePassword(passwordForm)" novalidate>
          <div class="form-group mb-4">
            <label class="fw-medium text-dark mb-1">Current Password <span class="text-danger">*</span></label>
            <div class="input-group shadow-sm">
              <span class="input-group-text bg-white text-muted border-end-0"><i class="fa-solid fa-key"></i></span>
              <input type="password" name="currentPassword" class="form-control border-start-0" ng-model="passwordData.currentPassword" required autocomplete="off" placeholder="Enter your current password">
            </div>
          </div>
          
          <div class="row g-3 mb-4">
            <div class="col-md-6 form-group">
              <label class="fw-medium text-dark mb-1">New Password <span class="text-danger">*</span></label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="newPassword" class="form-control border-start-0" ng-model="passwordData.newPassword" required minlength="8" autocomplete="new-password" placeholder="New password">
              </div>
              <small class="text-muted mt-1 d-block"><i class="fa-solid fa-circle-info me-1"></i> Minimum 8 characters</small>
            </div>
            
            <div class="col-md-6 form-group">
              <label class="fw-medium text-dark mb-1">Confirm New Password <span class="text-danger">*</span></label>
              <div class="input-group shadow-sm" ng-class="{'has-validation': passwordForm.confirmPassword.$dirty && passwordData.newPassword !== passwordData.confirmPassword}">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="confirmPassword" class="form-control border-start-0" ng-model="passwordData.confirmPassword" required autocomplete="new-password" placeholder="Confirm new password" ng-class="{'is-invalid': passwordForm.confirmPassword.$dirty && passwordData.newPassword !== passwordData.confirmPassword}">
              </div>
              <div class="text-danger small mt-1 fw-medium" ng-if="passwordForm.confirmPassword.$dirty && passwordData.newPassword !== passwordData.confirmPassword">
                <i class="fa-solid fa-circle-exclamation me-1"></i> Passwords do not match.
              </div>
            </div>
          </div>
          
          <div class="d-flex justify-content-end gap-2 mt-2">
            <button type="button" class="btn btn-light shadow-sm px-4 fw-bold rounded-pill" ng-click="goBack()">Cancel</button>
            <button type="submit" class="btn btn-danger shadow-sm px-4 fw-bold rounded-pill" ng-disabled="passwordForm.$invalid || passwordSaving || passwordData.newPassword !== passwordData.confirmPassword">
              <span ng-if="!passwordSaving"><i class="fa-solid fa-shield-halved me-2"></i> Update Password</span>
              <span ng-if="passwordSaving"><i class="fa-solid fa-spinner fa-spin me-2"></i> Updating...</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
